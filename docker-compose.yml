services:
  postgres:
    image: postgres:15
    container_name: sae_postgres
    restart: always

    environment:
      POSTGRES_DB: sae
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
    - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sae_redis
    restart: always

    command: redis-server --appendonly yes --appendfsync everysec

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: